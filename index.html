<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cooki UI</title>
    <meta name="description" content="Production-ready, source-first React & Tailwind components, physics interactions, shaders, and UI blocks. Free and open source." />
    <meta name="keywords" content="React components, Tailwind CSS, shadcn alternative, Framer Motion, source-first UI, WebGL shaders, UI blocks" />
    <link rel="canonical" href="https://cooki-ui.vercel.app/" />
    
    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cooki-ui.vercel.app/" />
    <meta property="og:title" content="Cooki UI — Source-First React & Tailwind Components" />
    <meta property="og:description" content="121+ production-ready interactive React components, spring physics, and WebGL backgrounds with source code ownership." />
    <meta property="og:image" content="https://cooki-ui.vercel.app/cooki-logo.svg" />
    <meta property="og:site_name" content="Cooki UI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cooki-ui.vercel.app/" />
    <meta name="twitter:title" content="Cooki UI — Source-First React & Tailwind Components" />
    <meta name="twitter:description" content="121+ production-ready interactive React components, spring physics, and WebGL backgrounds with source code ownership." />
    <meta name="twitter:image" content="https://cooki-ui.vercel.app/cooki-logo.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Cooki UI",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Production-ready, source-first React & Tailwind CSS component library with physics interactions and WebGL shaders."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cook_theme');
          var isDark = saved !== null ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-neutral-800 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
