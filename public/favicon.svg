<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cooki-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="cooki-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle with subtle border -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#cooki-bg)" stroke="#27272a" stroke-width="2" />
  
  <!-- Outer Glow Arc -->
  <circle cx="60" cy="60" r="34" stroke="url(#cooki-glow)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="140 70" filter="url(#glow-blur)" />

  <!-- Core Cookie / Orbit Geometry -->
  <circle cx="60" cy="60" r="22" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
  
  <!-- Modern Geometric Accent Dots / Chips -->
  <circle cx="53" cy="52" r="3.5" fill="#38bdf8" />
  <circle cx="68" cy="50" r="2.8" fill="#818cf8" />
  <circle cx="61" cy="66" r="4" fill="#c084fc" />
  <circle cx="49" cy="67" r="2.2" fill="#38bdf8" opacity="0.8" />

  <!-- Orbiting Micro Particle -->
  <circle cx="87" cy="42" r="3" fill="#38bdf8" filter="url(#glow-blur)" />
</svg>
